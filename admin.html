<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Studio · Cherry DN</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8D%92%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0C1718; --bg2:#111E20; --panel:#0e1a1c;
      --red:#8E1F2D; --red-t:#C05263; --red-d:#B03846;
      --ink:#E7DED4; --muted:#B9AEA3; --line:rgba(185,174,163,.16);
      --display:"Bodoni Moda",Didot,serif;
      --ui:Inter,system-ui,-apple-system,sans-serif;
      --poetic:"Cormorant Garamond",Georgia,serif;
      --top:58px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--ink); font-family:var(--ui); font-weight:300;
      line-height:1.6; -webkit-font-smoothing:antialiased; overflow:hidden; }
    a { color:inherit; text-decoration:none; }
    ::selection { background:var(--red); color:var(--ink); }
    :focus-visible { outline:1px solid var(--red-t); outline-offset:2px; }
    button { font:inherit; cursor:pointer; }

    /* ---------- the door ---------- */
    .gate { max-width:430px; margin:13vh auto; text-align:center; padding:0 1.4rem; }
    .gate__mark { font-family:var(--display); letter-spacing:.34em; font-size:.72rem; color:var(--red-t); }
    .gate h1 { font-family:var(--display); font-weight:400; font-size:clamp(2.1rem,7vw,3.1rem);
      letter-spacing:.09em; margin:1.1rem 0; }
    .gate > p { font-family:var(--poetic); font-style:italic; color:var(--muted); font-size:1.12rem; margin-bottom:2.1rem; }
    #gateMsg { min-height:1.5em; margin-top:1.2rem; font-family:var(--poetic); font-style:italic; color:var(--red-t); }

    input[type=text], input[type=email], input[type=password], textarea, select {
      width:100%; background:var(--bg2); color:var(--ink); border:1px solid var(--line);
      padding:.72rem .85rem; font-family:var(--ui); font-size:.95rem; border-radius:2px; }
    textarea { font-family:var(--poetic); font-size:1.05rem; line-height:1.6; resize:vertical; }
    input:focus, textarea:focus, select:focus { border-color:var(--red-t); outline:none; }
    .lit { animation:lit 1.2s ease; }
    @keyframes lit { 0%,100% { box-shadow:none; } 25% { box-shadow:0 0 0 2px var(--red-t); } }

    /* ---------- studio shell ---------- */
    .bar { position:fixed; inset:0 0 auto 0; height:var(--top); z-index:30; display:flex;
      align-items:center; gap:.8rem; padding:0 1rem;
      background:color-mix(in srgb,var(--bg) 94%,transparent); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line); }
    .bar__mark { font-family:var(--display); letter-spacing:.26em; font-size:.82rem; white-space:nowrap; }
    .bar__sp { flex:1; }
    .status { font-family:var(--poetic); font-style:italic; color:var(--muted); font-size:1rem;
      display:flex; align-items:center; gap:.6rem; }
    .status--ok { color:var(--red-t); }
    .status--bad { color:#E0864F; }
    .undo, .ghost { background:none; border:1px solid var(--line); color:var(--muted);
      font-family:var(--ui); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase;
      padding:.5rem .8rem; min-height:36px; border-radius:2px; }
    .undo:hover, .ghost:hover { border-color:var(--red-t); color:var(--red-t); }

    .wrap { position:fixed; inset:var(--top) 0 0 0; display:grid; grid-template-columns:minmax(380px,42%) 1fr; }

    #pages { position:absolute; z-index:20; top:0; left:0; width:250px; height:100%;
      background:var(--bg); border-right:1px solid var(--line); padding:1rem .7rem; overflow-y:auto;
      transform:translateX(-101%); transition:transform .32s cubic-bezier(.16,1,.3,1); }
    body.show-pages #pages { transform:none; }
    #pages button { display:block; width:100%; text-align:left; background:none; border:0;
      color:var(--muted); padding:.66rem .8rem; font-size:.9rem; border-left:2px solid transparent; }
    #pages button:hover { color:var(--ink); background:rgba(255,255,255,.03); }
    #pages button.on { color:var(--ink); border-left-color:var(--red); background:rgba(142,31,45,.09); }

    #shelf { overflow-y:auto; padding:1.6rem 1.4rem 6rem; border-right:1px solid var(--line); }
    .shelf__head { margin-bottom:1.6rem; }
    .shelf__head h2 { font-family:var(--display); font-weight:400; font-size:1.9rem; letter-spacing:.05em; }
    .shelf__head p { font-family:var(--poetic); font-style:italic; color:var(--muted); }

    .block { margin-bottom:2rem; }
    .block__name { font-family:var(--display); font-weight:400; font-size:1.15rem; letter-spacing:.14em;
      text-transform:uppercase; padding-bottom:.5rem; margin-bottom:1rem; border-bottom:1px solid var(--line);
      display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap; }
    .block__name em { font-style:normal; font-family:var(--ui); font-size:.6rem; letter-spacing:.14em;
      color:var(--muted); text-transform:none; }
    .none { font-family:var(--poetic); font-style:italic; color:var(--muted); padding:.3rem 0 .9rem; }

    .fld { display:grid; gap:.4rem; margin-bottom:1.15rem; }
    .lab { font-size:.78rem; color:var(--muted); display:flex; gap:.55rem; align-items:baseline; flex-wrap:wrap; }
    .hint { font-family:var(--poetic); font-style:italic; font-size:.92rem; color:rgba(185,174,163,.62); }

    .mediabox { position:relative; display:grid; place-items:center; min-height:120px;
      border:1px dashed var(--line); background:#0a1112; border-radius:2px; overflow:hidden; cursor:pointer; }
    .mediabox.has { border-style:solid; }
    .mediabox img { width:100%; height:170px; object-fit:cover; display:block; }
    .mediabox__none { font-size:.8rem; color:var(--muted); }
    .mediabox__do { position:absolute; bottom:0; left:0; right:0; text-align:center;
      background:rgba(12,23,24,.86); padding:.5rem; font-size:.7rem; letter-spacing:.1em; color:var(--ink); }
    .mediabox:hover { border-color:var(--red-t); }
    .mediabox--film { min-height:96px; }
    .mediabox--film .mediabox__none { font-family:var(--display); letter-spacing:.08em; font-size:.95rem; color:var(--ink); }
    .linkbox { font-size:.88rem; }

    /* groups she names herself */
    .gname { flex:1; min-width:9rem; max-width:22rem; background:none; border:0; border-bottom:1px solid transparent;
      color:var(--ink); font-family:var(--display); font-size:1.15rem; letter-spacing:.14em;
      text-transform:uppercase; padding:.1rem 0; }
    .gname:hover { border-bottom-color:var(--line); }
    .gname:focus { border-bottom-color:var(--red-t); outline:none; }
    .gmove { display:flex; gap:.4rem; flex-wrap:wrap; margin-left:auto; }
    .pics { display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:.5rem; margin:.4rem 0 0; }
    .pic { aspect-ratio:1; border:1px solid var(--line,#2a3a3c); border-radius:6px; cursor:pointer;
           background-size:cover; background-position:center; }
    .pic:hover { outline:2px solid var(--red-t,#CE6270); outline-offset:1px; }
    .dropper { margin-top:1.1rem; }
    .dropper__stage { border:1px solid var(--line,#2a3a3c); border-radius:8px; overflow:hidden;
                      display:inline-block; max-width:100%; }
    #dropCv { display:block; max-width:100%; height:auto; cursor:crosshair; }
    .stone { width:24px; height:24px; border-radius:50%; border:1px solid rgba(255,255,255,.25);
             cursor:pointer; margin-left:.35rem; vertical-align:middle; }
    .stone:hover { transform:scale(1.15); }
    .took { display:flex; align-items:center; gap:.8rem; margin-top:1rem; }
    .took__chip { width:44px; height:44px; border-radius:8px; flex:none;
                  border:1px solid rgba(255,255,255,.2); }
    .took .qr__lead { margin:0; }
    .took__ways { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:.6rem; }
    .took__ways .add { width:100%; margin:0; display:block; text-align:left; line-height:1.4; }
    .took__ways em { display:block; font-style:italic; font-size:.76rem; opacity:.75; margin-top:.2rem; }
    .axis { margin:0 0 1.5rem; }
    .axis .lab { display:block; margin-bottom:.45rem; }
    .axis__slide { width:100%; -webkit-appearance:none; appearance:none; height:3px;
                   border-radius:3px; background:var(--line,#2a3a3c); outline:none; }
    .axis__slide::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px;
                   border-radius:50%; background:var(--ink,#E7DED4); cursor:grab;
                   box-shadow:0 2px 10px rgba(0,0,0,.5); }
    .axis__slide::-moz-range-thumb { width:20px; height:20px; border:0; border-radius:50%;
                   background:var(--ink,#E7DED4); cursor:grab; }
    .axis__ends { display:flex; justify-content:space-between; margin-top:.4rem; gap:1rem; }
    .axis__ends i { font-style:normal; font-size:.74rem; color:var(--muted); opacity:.85; }
    .axis__grp { margin:1.6rem 0 1rem; letter-spacing:.14em; font-size:.76rem; }
    .axis__grp em { font-style:italic; letter-spacing:0; text-transform:none;
                    color:var(--muted); font-size:.82rem; margin-left:.5rem; }
    .moods { display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:.6rem; }
    .mood { position:relative; aspect-ratio:1; border:1px solid; border-radius:8px;
            cursor:pointer; overflow:hidden; display:flex; align-items:flex-end;
            justify-content:center; padding:.5rem; }
    .mood:hover { filter:brightness(1.18); }
    .mood__fire { position:absolute; top:26%; left:50%; width:34%; height:34%;
                  transform:translateX(-50%); border-radius:50%; filter:blur(7px); opacity:.95; }
    .mood__ink { position:relative; font-size:.66rem; letter-spacing:.14em;
                 text-transform:uppercase; }
    .sizes { position:absolute; z-index:6; top:0; left:0; right:0; display:flex; gap:.3rem;
             align-items:center; padding:.5rem .7rem; background:rgba(10,18,19,.86);
             backdrop-filter:blur(6px); border-bottom:1px solid var(--line,#2a3a3c); }
    .sizes button { background:transparent; border:1px solid transparent; color:var(--muted);
                    font:inherit; font-size:.72rem; letter-spacing:.06em; padding:.3rem .6rem;
                    border-radius:5px; cursor:pointer; white-space:nowrap; }
    .sizes button:hover { color:var(--ink); border-color:var(--line,#2a3a3c); }
    .sizes button.on { color:var(--ink); border-color:var(--red,#8E1F2D); background:rgba(142,31,45,.18); }
    .sizes__now { margin-left:auto; font-size:.7rem; color:var(--muted); opacity:.75; white-space:nowrap; }
    .glass__pane { position:absolute; inset:2.4rem 0 0 0; display:flex;
                   align-items:flex-start; justify-content:center; overflow:auto; background:#000; }
    #frame { width:100%; height:100%; border:0; display:block; background:var(--bg);
             transform-origin:top center; }
    .glass__pane.is-sized #frame { flex:none; box-shadow:0 0 0 1px var(--line,#2a3a3c), 0 18px 60px rgba(0,0,0,.6); }
    .waiting { font-size:.8rem; color:#E0B24C; white-space:nowrap; }
    .live { background:var(--red,#8E1F2D); color:#fff; border:0; border-radius:6px;
            padding:.5rem 1rem; font:inherit; font-size:.85rem; cursor:pointer; white-space:nowrap; }
    .live:hover { filter:brightness(1.12); }
    .live[disabled] { opacity:.6; cursor:default; }
    body.has-draft .bar { box-shadow:inset 0 -2px 0 #E0B24C; }
    .pending { border-bottom:1px solid var(--line,#2a3a3c); background:var(--bg2,#111E20);
               padding:1.1rem 1.4rem; max-height:44svh; overflow:auto; }
    .pending__name { font-size:1rem; margin:0 0 .2rem; }
    .pending__lead { color:var(--muted); font-size:.85rem; margin:0 0 .9rem; }
    .pending__list { list-style:none; margin:0 0 1rem; padding:0; }
    .pending__list li { display:flex; align-items:center; justify-content:space-between;
                        gap:1rem; padding:.45rem 0; border-top:1px solid var(--line,#2a3a3c); }
    .pending__what { font-size:.88rem; }
    .pending__what b { font-weight:500; }
    .pending__feet { display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
    .pending__feet .add { width:auto; margin:0; }
    .qr__lead { color:var(--muted); margin:.2rem 0 1rem; line-height:1.55; }
    .qr { display:flex; gap:1.4rem; align-items:flex-start; flex-wrap:wrap; margin-top:1rem; }
    .qr__paper { flex:none; width:214px; height:214px; background:#fff; border-radius:6px;
                 padding:0; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.35); }
    .qr__paper svg { display:block; width:100%; height:100%; }
    .qr__side { flex:1; min-width:11.5rem; }
    .qr--book { margin:.2rem 0 1.1rem; padding:1rem; border:1px solid var(--line, #2a3a3c); border-radius:8px; }
    .qr__addr { font-size:.78rem; color:var(--muted); word-break:break-all; margin:0 0 .6rem; opacity:.9; }
    .qr__note { color:var(--muted); font-size:.86rem; line-height:1.5; margin:0 0 .9rem; }
    .qr__note--bad { color:#E38C97; }
    .qr__side .add { width:100%; margin-top:.5rem; }
    .qr__test { color:var(--muted); font-size:.82rem; line-height:1.5; margin:.9rem 0 0; opacity:.85; }
    .gnew { display:flex; gap:.6rem; align-items:stretch; flex-wrap:wrap; }
    .gnew input { flex:1; min-width:12rem; }
    .gnew .add { width:auto; margin-top:0; white-space:nowrap; }

    .pills, .rooms { display:flex; gap:.5rem; flex-wrap:wrap; }
    .pill, .room { background:none; border:1px solid var(--line); color:var(--muted);
      padding:.6rem .95rem; min-height:44px; border-radius:2px; font-size:.85rem; text-align:left; }
    .pill.on, .room.on { border-color:var(--red); color:var(--ink); background:rgba(142,31,45,.12); }
    .room { display:grid; gap:.1rem; }
    .room strong { font-family:var(--display); font-weight:400; font-size:.95rem; letter-spacing:.08em; }
    .room span { font-family:var(--poetic); font-style:italic; font-size:.85rem; }

    .card { border:1px solid var(--line); background:var(--panel); border-radius:2px; margin-bottom:.55rem; }
    .card.open { border-color:var(--red); }
    .card--flat { display:flex; align-items:center; gap:.8rem; padding:.7rem .8rem; }
    .card__top { width:100%; display:flex; align-items:center; gap:.8rem; background:none; border:0;
      color:var(--ink); padding:.62rem .75rem; min-height:56px; text-align:left; }
    .card__thumb { width:44px; height:44px; flex:none; background:#0a1112; border:1px solid var(--line);
      display:grid; place-items:center; overflow:hidden; }
    .card__thumb img { width:100%; height:100%; object-fit:cover; }
    .card__thumb span { font-size:.5rem; color:var(--muted); }
    .card__name { flex:1; font-family:var(--display); font-weight:400; font-size:1.02rem;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .card__hid { font-size:.58rem; letter-spacing:.16em; text-transform:uppercase; color:var(--red-t);
      border:1px solid var(--line); padding:.2rem .45rem; border-radius:2px; }
    .card__chev { color:var(--muted); }
    .card.open .card__chev { transform:rotate(90deg); }
    .card__body { padding:.2rem .85rem 1rem; border-top:1px solid var(--line); }
    .card__foot { display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; padding-top:.4rem; }
    .card__move { display:flex; gap:.4rem; margin-left:auto; }
    .card__danger { margin-top:1rem; padding-top:.9rem; border-top:1px solid var(--line); }

    .onoff { display:inline-flex; align-items:center; gap:.5rem; cursor:pointer; font-size:.82rem; color:var(--muted); }
    .onoff input { accent-color:var(--red); width:17px; height:17px; }
    .mini { background:none; border:1px solid var(--line); color:var(--muted); padding:.55rem .8rem;
      min-height:44px; font-size:.72rem; border-radius:2px; }
    .mini:hover { border-color:var(--red-t); color:var(--red-t); }
    .mini--red { color:var(--red-d); border-color:rgba(176,56,70,.4); }
    .mini--red:hover { background:rgba(176,56,70,.12); color:var(--red-d); }

    .add { width:100%; background:none; border:1px solid var(--red); color:var(--ink);
      padding:.8rem; min-height:48px; border-radius:2px; font-size:.72rem; letter-spacing:.18em;
      text-transform:uppercase; margin-top:.5rem; }
    .add:hover { background:var(--red); }
    .drop { margin-top:.6rem; border:1px dashed var(--line); padding:1.1rem; text-align:center;
      font-family:var(--poetic); font-style:italic; color:var(--muted); border-radius:2px; }
    .drop.over { border-color:var(--red); background:rgba(142,31,45,.08); }

    /* ---------- the living page ---------- */
    .glass { position:relative; background:#000; }
    /* it says its piece, then gets out of the way of her page */
    .glass__hint { position:absolute; z-index:5; bottom:1rem; left:50%; transform:translateX(-50%);
      background:rgba(12,23,24,.9); border:1px solid var(--line); color:var(--muted);
      font-family:var(--poetic); font-style:italic; font-size:.9rem; padding:.35rem .9rem; border-radius:2px;
      pointer-events:none; opacity:0; animation:hint 7s ease forwards; transition:opacity .3s ease; }
    .glass:hover .glass__hint { opacity:1; }
    @keyframes hint { 0%,80% { opacity:1; } 100% { opacity:0; } }

    /* wide enough to keep every page in sight: no hunting for a button */
    @media (min-width:1200px) {
      .wrap { grid-template-columns:225px minmax(340px,34%) 1fr; }
      #pages { position:relative; transform:none; width:auto; height:auto; }
      #pagesBtn { display:none; }
    }

    @media (max-width:900px) {
      .wrap { grid-template-columns:1fr; }
      #shelf { border-right:0; }
      .glass { position:fixed; inset:var(--top) 0 0 0; transform:translateX(101%);
        transition:transform .32s cubic-bezier(.16,1,.3,1); z-index:15; }
      body.show-frame .glass { transform:none; }
      #seeBtn { display:inline-flex; }
    }
    @media (min-width:901px) { #seeBtn { display:none; } }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
  </style>
</head>
<body>

  <!-- the door -->
  <section class="gate" id="gate" hidden>
    <p class="gate__mark">CHERRY&nbsp;DN</p>
    <h1>YOUR STUDIO</h1>
    <p>This door is yours alone.</p>
    <form id="gateForm">
      <label class="fld"><span class="lab">email</span>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required />
      </label>
      <label class="fld"><span class="lab">password</span>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </label>
      <div><button class="add" id="gateBtn" type="submit">enter</button></div>
    </form>
    <p id="gateMsg"></p>
  </section>

  <!-- the studio -->
  <div id="studio" hidden>
    <header class="bar">
      <button class="ghost" id="pagesBtn" type="button">Pages</button>
      <span class="bar__mark">CHERRY&nbsp;DN</span>
      <span class="bar__sp"></span>
      <p class="status" id="status">All saved</p>
      <span class="waiting" id="waiting"></span>
      <button class="ghost" id="pendingBtn" type="button" hidden>What is waiting</button>
      <button class="live" id="liveBtn" type="button" hidden>Make it live</button>
      <button class="ghost" id="seeBtn" type="button">See it</button>
      <a class="ghost" href="index.html" target="_blank" rel="noopener">My live site</a>
      <button class="ghost" id="signout" type="button">Sign out</button>
    </header>

    <section class="pending" id="pending" hidden></section>

    <div class="wrap">
      <nav id="pages" aria-label="Pages"></nav>
      <main id="shelf"></main>
      <!-- never re-parent or re-src this frame: it would lose her place -->
      <div class="glass">
        <div class="sizes" id="sizes">
          <button type="button" data-size="fill" class="on">This window</button>
          <button type="button" data-size="1680">Big screen</button>
          <button type="button" data-size="1280">Laptop</button>
          <button type="button" data-size="820">Tablet</button>
          <button type="button" data-size="390">Phone</button>
          <span class="sizes__now" id="sizesNow"></span>
        </div>
        <p class="glass__hint">Your page, live. Tap anything to edit it.</p>
        <!-- never re-parent or re-src this frame: it would lose her place. Only
             its width, its height and its scale ever change, which re-lays the
             page out exactly as a real screen of that size would, without
             reloading it. -->
        <div class="glass__pane" id="pane">
          <iframe id="frame" title="Your page, live" src="index.html"></iframe>
        </div>
      </div>
    </div>
  </div>

  <input id="picker" type="file" hidden />

  <script src="js/cherry-config.js?v=2"></script>
  <script src="js/cherry-mood.js?v=1"></script>
  <script src="js/cherry-solve.js?v=2"></script>
  <script src="js/cherry-qr.js?v=1"></script>
  <script src="js/cherry-schema.js?v=10"></script>
  <script src="js/cherry-admin.js?v=20"></script>
</body>
</html>
