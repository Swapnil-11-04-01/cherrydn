<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Archive · Cherry DN</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8D%92%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0C1718; --bg2: #111E20; --panel: #0e1a1c;
      --red: #8E1F2D; --red-t: #C05263; --red-d: #B03846;
      --ink: #E7DED4; --muted: #B9AEA3; --line: rgba(185,174,163,0.16);
      --display: "Bodoni Moda", Didot, serif;
      --ui: Inter, system-ui, -apple-system, sans-serif;
      --poetic: "Cormorant Garamond", Georgia, serif;
      --rail: 232px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-weight: 300; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--red); color: var(--ink); }
    :focus-visible { outline: 1px solid var(--red-t); outline-offset: 2px; }

    /* ---------- the door ---------- */
    .gate { max-width: 430px; margin: 13vh auto; text-align: center; padding: 0 1.4rem; }
    .gate__mark { font-family: var(--display); letter-spacing: 0.34em; font-size: 0.72rem; color: var(--red-t); }
    .gate h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.1rem, 7vw, 3.1rem); letter-spacing: 0.09em; margin: 1.1rem 0; }
    .gate p { font-family: var(--poetic); font-style: italic; color: var(--muted); font-size: 1.12rem; margin-bottom: 2.1rem; }
    #gateMsg { min-height: 1.5em; margin-top: 1.2rem; font-family: var(--poetic); font-style: italic; color: var(--red-t); }

    input[type=text], input[type=email], input[type=password], textarea, select {
      width: 100%; background: var(--bg2); color: var(--ink);
      border: 1px solid var(--line); padding: 0.7rem 0.85rem;
      font-family: var(--ui); font-size: 0.92rem; border-radius: 2px;
    }
    textarea { font-family: var(--poetic); font-size: 1.02rem; line-height: 1.6; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: var(--red-t); outline: none; }
    select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 2.2rem; }

    .btn { font-family: var(--ui); font-size: 0.6rem; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--ink); background: transparent; border: 1px solid var(--red);
      padding: 0.68rem 1.25rem; cursor: pointer; min-height: 40px; border-radius: 2px;
      transition: background 0.25s, color 0.25s, border-color 0.25s; }
    .btn:hover { background: var(--red); }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .btn--ghost { border-color: var(--line); color: var(--muted); padding: 0.5rem 0.9rem; min-height: 34px; }
    .btn--ghost:hover { background: transparent; border-color: var(--red-t); color: var(--red-t); }
    .btn--add { margin-top: 1.2rem; }

    /* ---------- shell ---------- */
    .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 1rem;
      padding: 0.9rem 1.3rem; background: color-mix(in srgb, var(--bg) 93%, transparent);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .top__mark { font-family: var(--display); letter-spacing: 0.28em; font-size: 0.9rem; }
    .top__tag { font-size: 0.58rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
    .top__spacer { flex: 1; }
    #menuBtn { display: none; }

    .shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); align-items: start; }

    #rail { position: sticky; top: 61px; height: calc(100svh - 61px); overflow-y: auto;
      border-right: 1px solid var(--line); padding: 1.4rem 0.8rem 3rem; }
    #rail a { display: flex; align-items: baseline; gap: 0.7rem; padding: 0.62rem 0.8rem;
      font-size: 0.82rem; color: var(--muted); border-left: 2px solid transparent; transition: color 0.25s, border-color 0.25s, background 0.25s; }
    #rail a em { font-family: var(--display); font-style: normal; font-size: 0.62rem; letter-spacing: 0.18em; color: var(--red-t); min-width: 1.6em; }
    #rail a:hover { color: var(--ink); background: rgba(255,255,255,0.02); }
    #rail a.is-on { color: var(--ink); border-left-color: var(--red); background: rgba(142,31,45,0.08); }

    #sheet { padding: 2.4rem 2rem 8rem; max-width: 940px; }
    .loading { font-family: var(--poetic); font-style: italic; color: var(--muted); padding: 3rem 0; }

    .sheet__head { margin-bottom: 2.4rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--line); }
    .sheet__num { font-family: var(--display); font-size: 0.66rem; letter-spacing: 0.4em; color: var(--red-t); }
    .sheet__name { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 4.6vw, 2.7rem); letter-spacing: 0.07em; margin: 0.4rem 0 0.5rem; }
    .sheet__blurb { font-family: var(--poetic); font-style: italic; color: var(--muted); font-size: 1.06rem; }
    .sheet__see { display: inline-block; margin-top: 0.9rem; font-size: 0.58rem; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--red-t); border-bottom: 1px solid transparent; }
    .sheet__see:hover { border-bottom-color: var(--red); }

    .sheet__fields { display: grid; gap: 1.35rem; margin-bottom: 2.6rem; }
    .f { display: grid; gap: 0.4rem; }
    .f__label { font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
    .hint { font-family: var(--poetic); font-style: italic; text-transform: none; letter-spacing: 0; font-size: 0.88rem; color: rgba(185,174,163,0.6); }

    .media { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 0.9rem; align-items: start; }
    .media__thumb { aspect-ratio: 1; background: #0a1112; border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; }
    .media__thumb img { width: 100%; height: 100%; object-fit: cover; }
    .media__thumb span { font-size: 0.55rem; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
    .media__side { display: grid; gap: 0.5rem; }

    /* ---------- rows ---------- */
    .group { margin-bottom: 2.2rem; }
    .group__name { font-family: var(--display); font-weight: 400; font-size: 1.05rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--ink); padding-bottom: 0.5rem; margin-bottom: 0.9rem; border-bottom: 1px solid var(--line); }
    .group__name em { font-style: normal; font-family: var(--ui); font-size: 0.6rem; letter-spacing: 0.18em; color: var(--muted); }
    .none { font-family: var(--poetic); font-style: italic; color: var(--muted); padding: 0.4rem 0 1rem; }

    .row { display: grid; grid-template-columns: 22px 62px minmax(0,1fr); gap: 0.85rem; align-items: start;
      background: var(--panel); border: 1px solid var(--line); padding: 0.75rem; margin-bottom: 0.6rem; border-radius: 2px;
      transition: border-color 0.25s, opacity 0.2s; }
    .row:hover { border-color: rgba(185,174,163,0.3); }
    .row.is-open { border-color: var(--red); }
    .row.is-dragging { opacity: 0.4; }
    .row__grip { cursor: grab; color: rgba(185,174,163,0.4); font-size: 1rem; line-height: 1.4; user-select: none; text-align: center; }
    .row__grip:active { cursor: grabbing; }
    .row__thumb { aspect-ratio: 1; background: #0a1112; border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; }
    .row__thumb img { width: 100%; height: 100%; object-fit: cover; }
    .row__thumb span { font-size: 0.48rem; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; text-align: center; }
    .row__main { min-width: 0; }
    .row__head { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .row__head strong { font-family: var(--display); font-weight: 400; font-size: 1.05rem; letter-spacing: 0.03em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row__acts { display: flex; align-items: center; gap: 0.5rem; }
    .row__form { display: grid; gap: 1rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }

    .switch { display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.55rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .switch input { accent-color: var(--red); width: 15px; height: 15px; }

    .drop { margin-top: 0.9rem; border: 1px dashed var(--line); padding: 1.5rem; text-align: center; border-radius: 2px; transition: border-color 0.25s, background 0.25s; }
    .drop.is-over { border-color: var(--red); background: rgba(142,31,45,0.07); }
    .drop strong { display: block; font-family: var(--display); font-weight: 400; letter-spacing: 0.08em; }
    .drop span { font-family: var(--poetic); font-style: italic; color: var(--muted); }

    /* ---------- save bar + toast ---------- */
    .savebar { position: fixed; left: 50%; bottom: 1.4rem; transform: translate(-50%, 160%);
      display: flex; align-items: center; gap: 1rem; z-index: 40;
      background: color-mix(in srgb, var(--bg2) 96%, transparent); border: 1px solid var(--red);
      padding: 0.7rem 0.8rem 0.7rem 1.3rem; border-radius: 3px; box-shadow: 0 20px 50px rgba(0,0,0,0.55);
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1); }
    .savebar.is-on { transform: translate(-50%, 0); }
    .savebar span { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .savebar kbd { font-family: var(--ui); font-size: 0.55rem; color: rgba(185,174,163,0.55); letter-spacing: 0.1em; }

    .toast { position: fixed; left: 50%; top: 1rem; transform: translate(-50%, -160%); z-index: 50;
      background: var(--bg2); border: 1px solid var(--line); border-left: 2px solid var(--red-t);
      padding: 0.8rem 1.2rem; font-family: var(--poetic); font-style: italic; font-size: 1rem;
      max-width: min(560px, 92vw); border-radius: 2px; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1); }
    .toast.is-up { transform: translate(-50%, 0); }
    .toast--ok { border-left-color: var(--red-d); }
    .toast--bad { border-left-color: #E0864F; }

    @media (max-width: 820px) {
      .shell { grid-template-columns: minmax(0,1fr); }
      #menuBtn { display: inline-flex; }
      #rail { position: fixed; inset: 61px auto 0 0; width: 78vw; max-width: 300px; z-index: 25;
        background: var(--bg); transform: translateX(-102%); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); }
      #rail.is-open { transform: none; }
      #sheet { padding: 1.6rem 1.1rem 8rem; }
      .row { grid-template-columns: 20px 48px minmax(0,1fr); }
      .media { grid-template-columns: 64px minmax(0,1fr); }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <!-- the door -->
  <section class="gate" id="gate" hidden>
    <p class="gate__mark">CHERRY&nbsp;DN</p>
    <h1>THE ARCHIVE</h1>
    <p>This door is yours alone.</p>
    <form id="gateForm" autocomplete="on">
      <label class="f"><span class="f__label">email</span>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required />
      </label>
      <label class="f" style="margin-top:0.9rem"><span class="f__label">password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </label>
      <div style="margin-top:1.3rem"><button class="btn" id="gateBtn" type="submit">enter</button></div>
    </form>
    <p id="gateMsg"></p>
  </section>

  <!-- the desk -->
  <div id="shell" hidden>
    <header class="top">
      <button class="btn btn--ghost" id="menuBtn" type="button" aria-label="Sections">sections</button>
      <span class="top__mark">CHERRY&nbsp;DN</span>
      <span class="top__tag">the archive</span>
      <span class="top__spacer"></span>
      <a class="btn btn--ghost" href="index.html" target="_blank" rel="noopener">view site</a>
      <button class="btn btn--ghost" id="signout" type="button">sign out</button>
    </header>

    <div class="shell">
      <nav id="rail" aria-label="Sections"></nav>
      <main id="sheet"></main>
    </div>

    <div class="savebar" id="saveBar">
      <span id="dirtyCount">no changes</span>
      <button class="btn btn--ghost" id="revertBtn" type="button">discard</button>
      <button class="btn" id="saveBtn" type="button">save</button>
      <kbd>⌘S</kbd>
    </div>
  </div>

  <p class="toast" id="toast"></p>
  <input id="filePicker" type="file" hidden />

  <script src="js/cherry-config.js?v=2"></script>
  <script src="js/cherry-schema.js?v=1"></script>
  <script src="js/cherry-admin.js?v=4"></script>
</body>
</html>
